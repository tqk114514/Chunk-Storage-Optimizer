// The NeoForge mod. The code that does not depend on a loader lives one directory up:
// ../core (Minecraft-free, tested there) and ../common (Minecraft-facing), both added as source
// roots below so this module compiles them against the Minecraft/NeoForge it targets.
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    // zstd-jni comes from Maven Central.
    mavenCentral()
}

// ------------------------------------------------------------------ what we build for

// supported-versions.csv is the one list of Minecraft builds this mod ships for. Columns:
// minecraft, Java level, command-permission family, NeoForge floor, Fabric API, Mod Menu, FML major.
// Rows whose NeoForge floor is '-' exist for the other loader only and cannot be built here.
def supportedVersions = [:]
def versionTable = rootProject.file('supported-versions.csv')
versionTable.eachLine { line ->
    def trimmed = line.trim()
    if (trimmed.isEmpty() || trimmed.startsWith('#')) {
        return
    }
    def (mc, rowJavaLevel, family, floor, fabricApi, modMenu, fml, screenFamily, bossFamily) = trimmed.split(',').collect { it.trim() }
    supportedVersions[mc] = [neo: floor, java: rowJavaLevel as int, family: family, fml: fml, boss: bossFamily]
}
if (supportedVersions.isEmpty()) {
    throw new GradleException("${versionTable} has no data rows.")
}

def mcVersion = (project.findProperty('minecraft_version') ?: '26.1.2') as String
def target = supportedVersions[mcVersion]
if (target == null) {
    throw new GradleException("Minecraft ${mcVersion} is not listed in supported-versions.csv " \
        + "(known: ${supportedVersions.keySet().join(', ')}). Add a row before building for it.")
}
if (target.neo == '-') {
    throw new GradleException("Minecraft ${mcVersion} has no NeoForge build in supported-versions.csv.")
}
def neoVersion = (project.findProperty('neo_version') ?: target.neo) as String
def javaLevel = (project.findProperty('java_level') ?: target.java) as int
def apiFamily = target.family as String
if (!(apiFamily in ['legacy', 'modern'])) {
    throw new GradleException("Minecraft ${mcVersion} has family=${apiFamily}; use 'legacy' or 'modern'.")
}

// Which FancyModLoader major this row builds against, and so which config-type seam is compiled in.
// FML 12 (NeoForge 26.3 onwards) renamed ModConfig.Type.COMMON to LOCAL, and the old constant cannot
// be named in code that also has to build for FML 11. Stated per row rather than compared against a
// version threshold: a threshold would silently pick the wrong side the day NeoForge ships FML 12
// for a line nobody expected.
def fmlMajor = (project.findProperty('fml_major') ?: target.fml) as String
if (!(fmlMajor in ['11', '12'])) {
    throw new GradleException("Minecraft ${mcVersion} has FML=${fmlMajor}; use '11' or '12'.")
}
def bossFamily = target.boss as String
if (!(bossFamily in ['plain', 'uuid'])) {
    throw new GradleException("Minecraft ${mcVersion} has boss=${bossFamily}; use 'plain' or 'uuid'.")
}

// The loader drops the old "1." prefix, so Minecraft 1.21.11 is served by the 21.11 line and
// Minecraft 26.1.2 by the 26.1.2 line; a two-part version means patch 0, so Minecraft 1.21 is
// served by 21.0 and Minecraft 26.2 by 26.2.0. Guards against a row whose floor was copied in from
// a different Minecraft, which would otherwise only surface as a jar no player can load.
def loaderLine = mcVersion.startsWith('1.') ? mcVersion.substring(2) : mcVersion
if (!loaderLine.contains('.')) {
    loaderLine += '.0'
}
if (!neoVersion.startsWith("${loaderLine}.")) {
    throw new GradleException("NeoForge floor ${neoVersion} does not belong to Minecraft ${mcVersion} " \
        + "(expected a build of ${loaderLine}.N).")
}
// Stop the dependency range at the next loader line instead of running to infinity: that line is a
// different Minecraft, and an untested newer loader should refuse us, not crash.
def upperParts = loaderLine.split('\\.').collect { it as int }
upperParts[-1] = upperParts[-1] + 1
def neoUpper = upperParts.join('.')

// Loader and Minecraft both go in the file name: one mod version yields one jar per supported
// Minecraft per loader, and names without those two tokens are impossible to tell apart once
// uploaded. Fabric uses the same shape.
base.archivesName = "${mod_id}-neoforge-${mcVersion}"

java.toolchain.languageVersion = JavaLanguageVersion.of(javaLevel)

// Exactly one permission seam goes on the compile path, which is how the two command-permission
// APIs share one source tree without version checks at runtime.
sourceSets.main.java.srcDir rootProject.file('core/src/main/java')
sourceSets.main.java.srcDir rootProject.file("common/src/main/java")
sourceSets.main.java.srcDir rootProject.file("common/src/version/${apiFamily}/java")
sourceSets.main.java.srcDir rootProject.file("common/src/version/${bossFamily}/java")
sourceSets.main.java.srcDir rootProject.file("neoforge/src/version/fml${fmlMajor}/java")
sourceSets.main.resources.srcDir rootProject.file('core/src/main/resources')
// The same storage-layer test suite the fabric module runs (see the matching line there):
// common code, tested against this row's Minecraft, on both loaders the matrix builds.
sourceSets.test.java.srcDir rootProject.file('common/src/test/java')

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude('**/*.bbmodel') // BlockBench project files
    exclude('src/generated/**/.cache') // datagen cache files
}

neoForge {
    version = neoVersion

    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Debug hook: -PcsoQuickPlay=<world folder> auto-joins that save on launch, so the
            // client can be exercised without touching the UI (the Fabric module has the same
            // hook; it was how the Xaero compat bug was chased down).
            if (project.hasProperty('csoQuickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('csoQuickPlay')
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('core/src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // zstd via zstd-jni. jarJar() bundles it into our mod jar as a nested jar, which NeoForge
    // loads at runtime. NOTE: nested-jar native extraction is a known risk, so the mixin probes
    // zstd once at startup (RegionFileStorageMixin.cso$zstdUsable) and falls back to Anvil.
    implementation(jarJar("com.github.luben:zstd-jni:1.5.6-3"))

    // The Xaero World Map compat ships as a nested mod inside this jar — jarJar is NeoForge's
    // answer to loom's `include` (the Fabric module bundles its compat the same way), so
    // players download exactly one file. It is deliberately NOT linked any harder than that:
    // the compat's neoforge.mods.toml requires only the outer mod, and whether Xaero's World
    // Map is installed never becomes a dependency, because an unsatisfied dependency of a
    // nested mod would fail the whole jar's load for players without it. `implementation` also
    // puts it on the dev runs' classpath, so the compat loads in runClient without extracting
    // it; the compat resolves the same -Pminecraft_version row as this module and writes that
    // row's requirements into its metadata.
    //
    // Exercising the compat in a dev run needs Xaero's World Map dropped into run/mods as a
    // real mod jar — NOT a localRuntime dependency: MDG masks classpath mod jars out of the
    // mixin transformer, so the compat's mixins cannot reach classes loaded from one
    // (measured; the Xaero pin to copy is in compat/xaero/neoforge/build.gradle).
    implementation(jarJar(project(':compat:xaero:neoforge')))

    // The shared storage-layer suite (common/src/test, wired into this module's test source
    // set above): JUnit itself, same pin as core/build.gradle. The game classes reach the
    // suite through the classpath unions below, not a dependency here: the 26.x game jar is
    // a JPMS module, and ModDevGradle's own unitTest support loads it as one, which fights
    // Gradle's test-definition processing (measured: the worker starts modularised and
    // cannot see the test classes). On the plain classpath the module descriptor is inert —
    // the same way the fabric module runs the same suite against the same game.
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ModDevGradle puts the game on the main source set's classpath only. These tests do not
// need a NeoForge runtime — no mixin application, no mod loading — just the game's classes,
// so the main classpath is unioned onto the test classpath and stays there as jars.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Expand the placeholders in the mod metadata and the mixin config. A missing property makes the
// task fail, so a typo in the table cannot ship as a silently unresolved ${...}.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : mcVersion,
            minecraft_version_range: "[${mcVersion}]",
            neo_version            : neoVersion,
            neo_version_upper      : neoUpper,
            mixin_java_level       : "JAVA_${javaLevel}",
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_author             : mod_author,
            mod_version            : mod_version,
            // The icon field is the FML seam's other half: see the icon comment in the toml.
            mod_icon_field         : fmlMajor == '12' ? 'iconFile' : 'logoFile',
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

