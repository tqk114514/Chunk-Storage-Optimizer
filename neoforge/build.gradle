// The NeoForge mod. The code that does not depend on a loader lives one directory up:
// ../core (Minecraft-free, tested there) and ../common (Minecraft-facing), both added as source
// roots below so this module compiles them against the Minecraft/NeoForge it targets.
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    // zstd-jni comes from Maven Central.
    mavenCentral()
}

// ------------------------------------------------------------------ what we build for

// supported-versions.csv is the one list of Minecraft builds this mod ships for. Columns:
// minecraft, Java level, command-permission family, NeoForge floor, Fabric API, Mod Menu.
// Rows whose NeoForge floor is '-' exist for the other loader only and cannot be built here.
def supportedVersions = [:]
def versionTable = rootProject.file('supported-versions.csv')
versionTable.eachLine { line ->
    def trimmed = line.trim()
    if (trimmed.isEmpty() || trimmed.startsWith('#')) {
        return
    }
    def (mc, rowJavaLevel, family, floor, fabricApi, modMenu) = trimmed.split(',').collect { it.trim() }
    supportedVersions[mc] = [neo: floor, java: rowJavaLevel as int, family: family]
}
if (supportedVersions.isEmpty()) {
    throw new GradleException("${versionTable} has no data rows.")
}

def mcVersion = (project.findProperty('minecraft_version') ?: '26.1.2') as String
def target = supportedVersions[mcVersion]
if (target == null) {
    throw new GradleException("Minecraft ${mcVersion} is not listed in supported-versions.csv " \
        + "(known: ${supportedVersions.keySet().join(', ')}). Add a row before building for it.")
}
if (target.neo == '-') {
    throw new GradleException("Minecraft ${mcVersion} has no NeoForge build in supported-versions.csv.")
}
def neoVersion = (project.findProperty('neo_version') ?: target.neo) as String
def javaLevel = (project.findProperty('java_level') ?: target.java) as int
def apiFamily = target.family as String
if (!(apiFamily in ['legacy', 'modern'])) {
    throw new GradleException("Minecraft ${mcVersion} has family=${apiFamily}; use 'legacy' or 'modern'.")
}

// The loader drops the old "1." prefix, so Minecraft 1.21.11 is served by the 21.11 line and
// Minecraft 26.1.2 by the 26.1.2 line; a two-part version means patch 0, so Minecraft 1.21 is
// served by 21.0 and Minecraft 26.2 by 26.2.0. Guards against a row whose floor was copied in from
// a different Minecraft, which would otherwise only surface as a jar no player can load.
def loaderLine = mcVersion.startsWith('1.') ? mcVersion.substring(2) : mcVersion
if (!loaderLine.contains('.')) {
    loaderLine += '.0'
}
if (!neoVersion.startsWith("${loaderLine}.")) {
    throw new GradleException("NeoForge floor ${neoVersion} does not belong to Minecraft ${mcVersion} " \
        + "(expected a build of ${loaderLine}.N).")
}
// Stop the dependency range at the next loader line instead of running to infinity: that line is a
// different Minecraft, and an untested newer loader should refuse us, not crash.
def upperParts = loaderLine.split('\\.').collect { it as int }
upperParts[-1] = upperParts[-1] + 1
def neoUpper = upperParts.join('.')

// Loader and Minecraft both go in the file name: one mod version yields one jar per supported
// Minecraft per loader, and names without those two tokens are impossible to tell apart once
// uploaded. Fabric uses the same shape.
base.archivesName = "${mod_id}-neoforge-${mcVersion}"

java.toolchain.languageVersion = JavaLanguageVersion.of(javaLevel)

// Exactly one permission seam goes on the compile path, which is how the two command-permission
// APIs share one source tree without version checks at runtime.
sourceSets.main.java.srcDir rootProject.file('core/src/main/java')
sourceSets.main.java.srcDir rootProject.file("common/src/main/java")
sourceSets.main.java.srcDir rootProject.file("common/src/version/${apiFamily}/java")
sourceSets.main.resources.srcDir rootProject.file('core/src/main/resources')

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude('**/*.bbmodel') // BlockBench project files
    exclude('src/generated/**/.cache') // datagen cache files
}

neoForge {
    version = neoVersion

    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('core/src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // zstd via zstd-jni. jarJar() bundles it into our mod jar as a nested jar, which NeoForge
    // loads at runtime. NOTE: nested-jar native extraction is a known risk, so the mixin probes
    // zstd once at startup (RegionFileStorageMixin.cso$zstdUsable) and falls back to Anvil.
    implementation(jarJar("com.github.luben:zstd-jni:1.5.6-3"))
}

// Expand the placeholders in the mod metadata and the mixin config. A missing property makes the
// task fail, so a typo in the table cannot ship as a silently unresolved ${...}.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : mcVersion,
            minecraft_version_range: "[${mcVersion}]",
            neo_version            : neoVersion,
            neo_version_upper      : neoUpper,
            mixin_java_level       : "JAVA_${javaLevel}",
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_author             : mod_author,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
