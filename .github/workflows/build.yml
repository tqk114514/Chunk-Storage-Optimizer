name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One broken Minecraft version must not hide whether the others still build — that is the
      # whole point of the matrix.
      fail-fast: false
      matrix:
        # Keep in sync with supportedVersions in build.gradle.
        minecraft_version: ['26.1.2', '26.2.0']
    name: build ${{ matrix.minecraft_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # The Java level actually used comes from supportedVersions in build.gradle; this only has to
      # provide a JDK new enough for every row in that table.
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft_version }}

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chunkstorageoptimizer-${{ matrix.minecraft_version }}
          path: build/libs/*.jar
          if-no-files-found: error
