name: Build

on: [push, pull_request]

jobs:
  # The Minecraft matrix is read from supported-versions.csv so it cannot drift from the table
  # build.gradle compiles against — one row missing from either side is now impossible.
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: List the supported Minecraft versions
        id: list
        run: |
          versions=$(grep -v '^#' supported-versions.csv | tr -d ' \t' | grep -v '^$' \
            | cut -d, -f1 | jq -R -s 'split("\n") | map(select(length > 0))')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "matrix: $versions"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # One broken Minecraft version must not hide whether the others still build — that is the
      # whole point of the matrix.
      fail-fast: false
      matrix:
        minecraft_version: ${{ fromJSON(needs.discover.outputs.versions) }}
    name: build ${{ matrix.minecraft_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Each row compiles with the Java level its Minecraft actually ships on (declared in
      # supported-versions.csv), so Gradle has to be able to find both toolchains.
      - name: Setup JDK 25
        id: jdk25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup JDK 21
        id: jdk21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: >
          ./gradlew build
          -Pminecraft_version=${{ matrix.minecraft_version }}
          "-Porg.gradle.java.installations.paths=${{ steps.jdk25.outputs.path }},${{ steps.jdk21.outputs.path }}"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chunkstorageoptimizer-${{ matrix.minecraft_version }}
          path: build/libs/*.jar
          if-no-files-found: error
