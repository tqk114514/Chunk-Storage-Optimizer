name: Build

on: [push, pull_request]

jobs:
  # The Minecraft matrix is read from supported-versions.csv so it cannot drift from the table
  # build.gradle compiles against — one row missing from either side is now impossible.
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: List the supported Minecraft versions
        id: list
        run: |
          # -c is not cosmetic: a multi-line value cannot be written through $GITHUB_OUTPUT.
          # \r is stripped because the csv may be checked out with CRLF on Windows clones.
          versions=$(grep -v '^#' supported-versions.csv | tr -d ' \t\r' | grep -v '^$' \
            | cut -d, -f1 | jq -R -sc 'split("\n") | map(select(length > 0))')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "matrix: $versions"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # One broken Minecraft version must not hide whether the others still build — that is the
      # whole point of the matrix.
      fail-fast: false
      matrix:
        minecraft_version: ${{ fromJSON(needs.discover.outputs.versions) }}
    name: build ${{ matrix.minecraft_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Rows compile with the Java level their Minecraft ships on (declared in
      # supported-versions.csv), so both toolchains must be findable. Gradle itself runs on 25, which
      # is what the last setup-java step sets JAVA_HOME to; the toolchain property below is how it
      # also finds 21.
      - name: Setup JDK 21 (toolchain for the 1.21 line)
        id: jdk21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 25 (runs Gradle)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # One cache per row: rows generate per-Minecraft artifacts under
          # ~/.gradle/caches/neoformruntime, so a shared key makes a row able to restore another
          # row's state.
          key: ${{ runner.os }}-gradle-${{ matrix.minecraft_version }}

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The NeoForge module is the only one with a Minecraft dependency, so it is what a row builds.
      - name: Build the NeoForge mod
        run: >
          ./gradlew :core:test :neoforge:build
          -Pminecraft_version=${{ matrix.minecraft_version }}
          "-Porg.gradle.java.installations.paths=${{ steps.jdk25.outputs.path }},${{ steps.jdk21.outputs.path }}"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chunkstorageoptimizer-${{ matrix.minecraft_version }}
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
