name: Build

# A release is one tag, `v<version>`. What gets built does not come from the tag at all — the matrix
# is read from supported-versions.csv — so a single tag builds every jar for every Minecraft the mod
# ships for and publishes all of them. The earlier convention of one tag per csv row meant fourteen
# tags per release, and because GitHub starts a run per tag that was fourteen runs, thirteen of which
# had nothing to do.
#
# A manual run does everything a release does without cutting a tag, which is how the upload path
# gets exercised. It plans by default and publishes when the box is unticked.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and plan the upload without calling Modrinth
        type: boolean
        default: true

jobs:
  # The pins in supported-versions.csv are checked against upstream rather than trusted, so a row
  # that has gone stale fails here instead of shipping a jar no player can load. It runs beside the
  # matrix rather than before it: a stale pin is worth knowing about, but it should not stop the jars
  # from being built and tested.
  pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check the loader pins against upstream
        run: bash tools/check-loader-versions.sh

  # The matrix and the release decision are both worked out here, so the two jobs below stay simple
  # and the matrix — read from supported-versions.csv so it cannot drift from the table the build
  # scripts compile against — exists in exactly one place.
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Work out the matrix, and what this event is for
        id: plan
        run: |
          set -euo pipefail
          rows=$(grep -v '^#' supported-versions.csv | tr -d ' \t\r' | grep -v '^$')

          # -c is not cosmetic: a multi-line value cannot be written through $GITHUB_OUTPUT.
          # A '-' in a loader's column means that loader never shipped for that Minecraft, so the
          # pair gets no job; column 4 is the NeoForge floor, column 5 the Fabric API.
          matrix=$(printf '%s\n' "$rows" | jq -Rsc '
              split("\n")
              | map(select(length > 0) | split(","))
              | map(
                  (if .[3] != "-" then [{loader: "neoforge", minecraft_version: .[0]}] else [] end)
                  + (if .[4] != "-" then [{loader: "fabric", minecraft_version: .[0]}] else [] end)
                )
              | add')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix: $matrix"

          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')

          release=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # The tag carries the version as well, so one that disagrees with gradle.properties would
            # publish jars under the wrong number. Refuse rather than quietly publishing something
            # mislabelled.
            tag_version=${GITHUB_REF_NAME#v}
            if [ "$tag_version" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME names version $tag_version, but gradle.properties says $version" >&2
              exit 1
            fi
            release=true
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release=true
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release: $release, version: $version"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # One broken combination must not hide whether the others still build — that is the whole
      # point of the matrix.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: build ${{ matrix.loader }} ${{ matrix.minecraft_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Rows compile with the Java level their Minecraft ships on (declared in
      # supported-versions.csv), so both toolchains must be findable. Gradle itself runs on 25, which
      # is what the last setup-java step sets JAVA_HOME to; the toolchain property below is how it
      # also finds 21.
      - name: Setup JDK 21 (toolchain for the 1.21 line)
        id: jdk21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 25 (runs Gradle)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # One cache per row: rows generate per-Minecraft artifacts under ~/.gradle/caches, so a
          # shared key makes a row able to restore another row's state. The loader is in the key
          # because NeoForge and Fabric keep their artifacts in different directories.
          key: ${{ runner.os }}-gradle-${{ matrix.loader }}-${{ matrix.minecraft_version }}

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The loader module named by the row is the one with a Minecraft dependency, so it is what
      # gets built; :core:test covers the format layer, which is the same jar-independent code on
      # every row.
      - name: Build the mod
        run: >
          ./gradlew :core:test :${{ matrix.loader }}:build
          -Pminecraft_version=${{ matrix.minecraft_version }}
          "-Porg.gradle.java.installations.paths=${{ steps.jdk25.outputs.path }},${{ steps.jdk21.outputs.path }}"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chunkstorageoptimizer-${{ matrix.loader }}-${{ matrix.minecraft_version }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error

  # Publishing goes to Modrinth as one version per (loader, Minecraft) pair: a version's `loaders`
  # and `game_versions` are what the launcher matches on before taking that version's primary file,
  # so folding both loaders into a single version would hand a Fabric player the NeoForge jar.
  publish:
    needs: [discover, build]
    if: needs.discover.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect the jars the matrix built
        uses: actions/download-artifact@v4
        with:
          pattern: chunkstorageoptimizer-*
          merge-multiple: true
          path: dist

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          # A repository variable, and deliberately required rather than defaulted: a guessed slug
          # that is wrong fails as a 404, which reads like the project vanished, where an empty value
          # fails saying exactly what is missing.
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
          VERSION: ${{ needs.discover.outputs.version }}
          JARS_DIR: dist
          # A tag publishes. A manual run only plans unless the box was unticked.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: bash tools/publish-modrinth.sh
