name: Build

# A tag is a release: the same matrix that builds on every push also feeds Modrinth. A manual run
# does everything a tag does without cutting one, which is how the upload path gets exercised — it
# only plans by default, and publishes when the box is unticked.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and plan the upload without calling Modrinth
        type: boolean
        default: true

jobs:
  # The matrix is read from supported-versions.csv so it cannot drift from the table the build
  # scripts compile against — one row missing from either side is now impossible. Each row expands
  # to one job per loader that actually ships for that Minecraft.
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: List the loader and Minecraft pairs to build
        id: list
        run: |
          # -c is not cosmetic: a multi-line value cannot be written through $GITHUB_OUTPUT.
          # \r is stripped because the csv may be checked out with CRLF on Windows clones.
          # A '-' in a loader's column means that loader never shipped for that Minecraft, so the
          # pair gets no job; column 4 is the NeoForge floor, column 5 the Fabric API.
          matrix=$(grep -v '^#' supported-versions.csv | tr -d ' \t\r' | grep -v '^$' \
            | jq -Rsc '
                split("\n")
                | map(select(length > 0) | split(","))
                | map(
                    (if .[3] != "-" then [{loader: "neoforge", minecraft_version: .[0]}] else [] end)
                    + (if .[4] != "-" then [{loader: "fabric", minecraft_version: .[0]}] else [] end)
                  )
                | add')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix: $matrix"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # One broken combination must not hide whether the others still build — that is the whole
      # point of the matrix.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: build ${{ matrix.loader }} ${{ matrix.minecraft_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Rows compile with the Java level their Minecraft ships on (declared in
      # supported-versions.csv), so both toolchains must be findable. Gradle itself runs on 25, which
      # is what the last setup-java step sets JAVA_HOME to; the toolchain property below is how it
      # also finds 21.
      - name: Setup JDK 21 (toolchain for the 1.21 line)
        id: jdk21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 25 (runs Gradle)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # One cache per row: rows generate per-Minecraft artifacts under ~/.gradle/caches, so a
          # shared key makes a row able to restore another row's state. The loader is in the key
          # because NeoForge and Fabric keep their artifacts in different directories.
          key: ${{ runner.os }}-gradle-${{ matrix.loader }}-${{ matrix.minecraft_version }}

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The loader module named by the row is the one with a Minecraft dependency, so it is what
      # gets built; :core:test covers the format layer, which is the same jar-independent code on
      # every row.
      - name: Build the mod
        run: >
          ./gradlew :core:test :${{ matrix.loader }}:build
          -Pminecraft_version=${{ matrix.minecraft_version }}
          "-Porg.gradle.java.installations.paths=${{ steps.jdk25.outputs.path }},${{ steps.jdk21.outputs.path }}"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chunkstorageoptimizer-${{ matrix.loader }}-${{ matrix.minecraft_version }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error

  # Publishing lives here rather than in a workflow of its own so the matrix — which is derived from
  # supported-versions.csv — exists in exactly one place. It goes to Modrinth as one version per
  # (loader, Minecraft) pair: a version's `loaders` and `game_versions` are what the launcher matches
  # on before taking that version's primary file, so folding both loaders into a single version
  # would hand a Fabric player the NeoForge jar.
  publish:
    needs: [discover, build]
    if: startsWith(github.ref, 'refs/tags/mc-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Work out the version, and check a tag agrees with it
        id: version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # The tag carries the version too (mc-<minecraft>-<version>), so a tag that disagrees
            # with gradle.properties would publish jars under the wrong number. Refuse instead.
            tagged=${GITHUB_REF_NAME##*-}
            if [ "$tagged" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME does not name the version in gradle.properties ($version)" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Collect the jars the matrix built
        uses: actions/download-artifact@v4
        with:
          pattern: chunkstorageoptimizer-*
          merge-multiple: true
          path: dist

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          # A repository variable, so the slug can be corrected without editing this file.
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT || 'chunk-storage-optimizer' }}
          VERSION: ${{ steps.version.outputs.version }}
          JARS_DIR: dist
          # A tag publishes. A manual run only plans unless the box was unticked.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: bash tools/publish-modrinth.sh
