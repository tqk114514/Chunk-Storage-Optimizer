// Shared conventions for the modules:
//   core      format / metrics / offline tooling and the unit tests. Depends on nothing but zstd:
//             if Minecraft or a loader ever leaks in here, :core:test stops compiling, which is the
//             boundary this mod's multi-loader plan rests on.
//   common    Minecraft-facing but loader-free sources. Not a module: each loader adds it as a
//             source directory and compiles it against its own Minecraft.
//   neoforge  the NeoForge mod - entrypoint, ModConfigSpec config, mods.toml and mixin configs.
plugins {
    id 'base'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    }
}
