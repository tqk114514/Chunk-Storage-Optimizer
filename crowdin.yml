# Crowdin CLI / GitHub Action configuration. The values that identify the project live in
# repository secrets (set up at Settings -> Secrets and variables -> Actions):
#   CROWDIN_PROJECT_ID      the numeric ID from crowdin.com/project/<name>/tools/api
#   CROWDIN_PERSONAL_TOKEN  created at crowdin.com/settings#api-key — scopes: Projects (read),
#                           Source files & strings (read+write), Translations (read+write)
#
# Three source trees, one entry each: the main mod's strings (shipped by both loaders via
# core's shared resources) and the two compat mods' strings. The Xaero entry's files are the
# single source for BOTH halves of that compat: the Fabric jar ships them as its own
# resources, and the nested NeoForge jar stages them at build time — NeoForge's Mods screen
# translates a mod's description through the language map (fml.menu.mods.info.description /
# neoforge.screen.mods.info.description), with the neoforge.mods.toml text as the English
# fallback, so the nested compat needs the lang files after all. The Voxy entry stays
# Fabric-only because that compat has no NeoForge half.
#
# Crowdin language codes (zh-CN, pt-BR, ja...) become Minecraft's lowercase-with-underscore file
# names (zh_cn, pt_br, ja_jp) through the mapping repeated below — keyed on the
# BUILT-IN %locale% placeholder, because the CLI validator rejects patterns
# whose only placeholder is a custom mapping name (measured: "The 'translation'
# parameter should contain at least one language placeholder") and the editor flags
# replace the placeholder output entirely, so every project language needs an entry — deliberately NOT a
# YAML anchor: the CLI's config validator reads aliased entries as strings and rejects them
# (measured: exactly one "expected record, received string" per aliased entry). Languages that
# are not enabled in the Crowdin project ignore their mapping until they are, so the list is
# wider than the six languages the mod ships today.
"project_id_env": "CROWDIN_PROJECT_ID"
"api_token_env": "CROWDIN_PERSONAL_TOKEN"
"base_path": "."
"preserve_hierarchy": true

"files": [
  {
    "source": "/core/src/main/resources/assets/chunkstorageoptimizer/lang/en_us.json",
    "translation": "/core/src/main/resources/assets/chunkstorageoptimizer/lang/%locale%.json",
    "languages_mapping": {
      "locale": {
        "zh-CN": "zh_cn",
        "zh-TW": "zh_tw",
        "zh-HK": "zh_hk",
        "ja": "ja_jp",
        "ko": "ko_kr",
