// The Fabric mod. Same layering as neoforge: ../core and ../common are added as source roots and
// compiled against the Minecraft this row targets.
plugins {
    id 'java-library'
    id 'fabric-loom' version '1.18.2'
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        // Mod Menu is published here, not on the Fabric maven.
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
    mavenCentral()
}

// ------------------------------------------------------------------ what we build for

// supported-versions.csv is the one list of Minecraft builds this mod ships for. Columns:
// minecraft, Java level, command-permission family, NeoForge floor, Fabric API, Mod Menu, FML major,
// Fabric screen. The FML column is NeoForge's business (it selects that side's config-type seam) and
// is named here only to reach the column after it; the screen column selects this side's
// fabric/src/version/<value>/java seam (the client screen switch moved in the 26.2 client).
// Rows whose Fabric API column is '-' are not covered by this loader.
def supportedVersions = [:]
def versionTable = rootProject.file('supported-versions.csv')
versionTable.eachLine { line ->
    def trimmed = line.trim()
    if (trimmed.isEmpty() || trimmed.startsWith('#')) {
        return
    }
    def (mc, rowJavaLevel, family, neoFloor, fabricApi, modMenu, fml, screenFamily) = trimmed.split(',').collect { it.trim() }
    supportedVersions[mc] = [java: rowJavaLevel as int, family: family, neo: neoFloor, api: fabricApi, modmenu: modMenu, screen: screenFamily]
}
if (supportedVersions.isEmpty()) {
    throw new GradleException("${versionTable} has no data rows.")
}

def mcVersion = (project.findProperty('minecraft_version') ?: '1.21.11') as String
def target = supportedVersions[mcVersion]
if (target == null) {
    throw new GradleException("Minecraft ${mcVersion} is not listed in supported-versions.csv " \
        + "(known: ${supportedVersions.keySet().join(', ')}). Add a row before building for it.")
}
if (target.api == '-') {
    throw new GradleException("Minecraft ${mcVersion} has no Fabric row in supported-versions.csv.")
}
def javaLevel = (project.findProperty('java_level') ?: target.java) as int
def apiFamily = target.family as String
if (!(apiFamily in ['legacy', 'modern'])) {
    throw new GradleException("Minecraft ${mcVersion} has family=${apiFamily}; use 'legacy' or 'modern'.")
}
def screenFamily = target.screen as String
if (!(screenFamily in ['mc', 'gui'])) {
    throw new GradleException("Minecraft ${mcVersion} has screen=${screenFamily}; use 'mc' or 'gui'.")
}
def fabricApiVersion = (project.findProperty('fabric_api_version') ?: target.api) as String
def modMenuVersion = (project.findProperty('modmenu_version') ?: target.modmenu) as String
// The loader this module compiles and dev-runs against. It is deliberately NOT written into
// fabric.mod.json as a floor: the only hard requirement the mod has is Fabric API, and every
// fabric-api module already carries its own `fabricloader` floor (>=0.15.11 for Minecraft 1.21.1,
// measured). Copying that number here could only ever be stricter or looser than the dependency
// that actually decides it - verified by running this jar on 0.15.11, where mixin binding and the
// nested zstd jar work.
def loaderVersion = (project.findProperty('fabric_loader_version') ?: '0.19.5') as String

// 26.x ships an unobfuscated client, so there is nothing to remap: those rows declare no
// mappings at all, which stable loom 1.18+ accepts (Sodium for 26.3 builds exactly this way).
// The game's own version id also drops a trailing ".0" that the csv row key keeps ("26.3.0" is
// the loader-line spelling of the game version "26.3"), and both com.mojang:minecraft and
// fabric.mod.json need the game's spelling.
def gameVersion = mcVersion.startsWith('26.') && mcVersion.endsWith('.0')
        ? mcVersion.substring(0, mcVersion.length() - 2)
        : mcVersion

// The classic fabric-loom plugin wires a mappings configuration unconditionally, so the 26.x
// rows build with remapping disabled instead — loom's own switch for the unobfuscated games
// (sodium's 26.3 build reaches the same state by applying loom's no-remap marker plugin,
// "net.fabricmc.fabric-loom"). Loom reads fabric.loom.disableObfuscation while its plugin is
// applied, before this script body runs, so settings.gradle sets the flag for the 26.x rows;
// one plugin id then serves every row.

// Loader and Minecraft both go in the file name, as on the NeoForge side.
base.archivesName = "${mod_id}-fabric-${mcVersion}"

java.toolchain.languageVersion = JavaLanguageVersion.of(javaLevel)

sourceSets.main.java.srcDir rootProject.file('core/src/main/java')
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.java.srcDir rootProject.file("common/src/version/${apiFamily}/java")
sourceSets.main.java.srcDir rootProject.file("fabric/src/version/${screenFamily}/java")
sourceSets.main.resources.srcDir rootProject.file('core/src/main/resources')

loom {
    runs {
        client {
            client()
            // Debug hook: -PcsoQuickPlay=<world folder> auto-joins that save on launch, so the
            // client can be exercised without touching the UI (used for the Xaero compat bug).
            if (project.hasProperty('csoQuickPlay')) {
                programArgs '--quickPlaySingleplayer', project.property('csoQuickPlay')
            }
        }
        // server() already passes --nogui; serverWithGui() is the opt-out.
        server {
            server()
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${gameVersion}"
    if (!mcVersion.startsWith('26.')) {
        mappings loom.officialMojangMappings()
    }
    // Mod Menu only contributes the config-screen hook, so it is compiled against but never
    // required: without it the mod still loads and the config stays a file.
    //
    // With remapping disabled loom does not create the mod* dependency DSL: the published 26.x
    // mods already carry official names, so the plain configurations are used directly
    // (sodium's 26.3 build declares its Fabric dependencies the same way). `include` exists in
    // both modes.
    if (mcVersion.startsWith('26.')) {
        implementation "net.fabricmc:fabric-loader:${loaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
        compileOnly "com.terraformersmc:modmenu:${modMenuVersion}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
        modCompileOnly "com.terraformersmc:modmenu:${modMenuVersion}"
    }

    // The compatibility mods ship as nested mods inside this jar — one download, and Mod Menu
    // lists each as a child entry (C2ME bundles its modules the same way). `include` is the
    // whole wiring: it nests the jar into remapJar's output and makes Gradle build it on
    // demand, and it is deliberately NOT also a mod dependency — loom reads those at
    // configuration time, before any jar exists on a clean one-shot build, and each compat's
    // fabric.mod.json is self-contained anyway: it requires only the outer mod, and whether
    // the third-party mod is installed is decided at runtime — its classes are the mixins'
    // targets, so without it the mixins simply have nothing to apply to — never by a loader
    // dependency, because an unsatisfied dependency of a nested mod would fail the whole
    // jar's load for players without it. Each compat resolves the same -Pminecraft_version
    // row as this module and writes that row's requirements into its metadata.
    include project(':compat:voxy:fabric')
    include project(':compat:xaero:fabric')

    // zstd-jni ships inside the jar through loom's `include`, which nests it the way NeoForge's
    // jarJar does. The mixin probes it once and falls back to Anvil if it cannot be loaded.
    implementation 'com.github.luben:zstd-jni:1.5.6-3'
    include 'com.github.luben:zstd-jni:1.5.6-3'
}

// fabric.mod.json carries the version and the Minecraft dependency, so it is expanded at build
// time. A missing key fails the task rather than shipping an unresolved ${...}.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id        : mod_id,
            mod_name      : mod_name,
            mod_license   : mod_license,
            mod_author    : mod_author,
            mod_version   : mod_version,
            minecraft_version: gameVersion,
            mixin_java_level : "JAVA_${javaLevel}",
            java_level        : javaLevel,
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand replaceProperties
    }
}
