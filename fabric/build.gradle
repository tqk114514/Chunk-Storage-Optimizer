// The Fabric mod. Same layering as neoforge: ../core and ../common are added as source roots and
// compiled against the Minecraft this row targets.
plugins {
    id 'java-library'
    id 'fabric-loom' version '1.15.5'
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        // Mod Menu is published here, not on the Fabric maven.
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
    mavenCentral()
}

// ------------------------------------------------------------------ what we build for

// supported-versions.csv is the one list of Minecraft builds this mod ships for. Columns:
// minecraft, Java level, command-permission family, NeoForge floor, Fabric API, Mod Menu.
// Rows whose Fabric API column is '-' are not covered by this loader.
def supportedVersions = [:]
def versionTable = rootProject.file('supported-versions.csv')
versionTable.eachLine { line ->
    def trimmed = line.trim()
    if (trimmed.isEmpty() || trimmed.startsWith('#')) {
        return
    }
    def (mc, rowJavaLevel, family, neoFloor, fabricApi, modMenu) = trimmed.split(',').collect { it.trim() }
    supportedVersions[mc] = [java: rowJavaLevel as int, family: family, neo: neoFloor, api: fabricApi, modmenu: modMenu]
}
if (supportedVersions.isEmpty()) {
    throw new GradleException("${versionTable} has no data rows.")
}

def mcVersion = (project.findProperty('minecraft_version') ?: '1.21.11') as String
def target = supportedVersions[mcVersion]
if (target == null) {
    throw new GradleException("Minecraft ${mcVersion} is not listed in supported-versions.csv " \
        + "(known: ${supportedVersions.keySet().join(', ')}). Add a row before building for it.")
}
if (target.api == '-') {
    throw new GradleException("Minecraft ${mcVersion} has no Fabric row in supported-versions.csv.")
}
def javaLevel = (project.findProperty('java_level') ?: target.java) as int
def apiFamily = target.family as String
if (!(apiFamily in ['legacy', 'modern'])) {
    throw new GradleException("Minecraft ${mcVersion} has family=${apiFamily}; use 'legacy' or 'modern'.")
}
def fabricApiVersion = (project.findProperty('fabric_api_version') ?: target.api) as String
def modMenuVersion = (project.findProperty('modmenu_version') ?: target.modmenu) as String
def loaderVersion = (project.findProperty('fabric_loader_version') ?: '0.19.5') as String

// Minecraft stopped publishing obfuscated clients with 26.x, so the official mappings a
// mojmap build needs no longer exist there - and loom still insists on a mappings
// configuration. Fabric mods for 26.x are currently built against a loom snapshot (Mod Menu
// itself does), which this project deliberately does not pin. Refuse the row instead of failing
// somewhere obscure.
if (mcVersion.startsWith('26.')) {
    throw new GradleException("Minecraft ${mcVersion} cannot be built for Fabric with a stable loom: " \
        + "26.x ships an unobfuscated client and no official mappings. See docs/uncovered-minecraft-versions.md.")
}

// Loader and Minecraft both go in the file name, as on the NeoForge side.
base.archivesName = "${mod_id}-fabric-${mcVersion}"

java.toolchain.languageVersion = JavaLanguageVersion.of(javaLevel)

sourceSets.main.java.srcDir rootProject.file('core/src/main/java')
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.java.srcDir rootProject.file("common/src/version/${apiFamily}/java")
sourceSets.main.resources.srcDir rootProject.file('core/src/main/resources')

loom {
    runs {
        client {
            client()
        }
        // server() already passes --nogui; serverWithGui() is the opt-out.
        server {
            server()
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    // Mod Menu only contributes the config-screen hook, so it is compiled against but never
    // required: without it the mod still loads and the config stays a file.
    modCompileOnly "com.terraformersmc:modmenu:${modMenuVersion}"

    // zstd-jni ships inside the jar through loom's `include`, which nests it the way NeoForge's
    // jarJar does. The mixin probes it once and falls back to Anvil if it cannot be loaded.
    implementation 'com.github.luben:zstd-jni:1.5.6-3'
    include 'com.github.luben:zstd-jni:1.5.6-3'
}

// fabric.mod.json carries the version and the Minecraft dependency, so it is expanded at build
// time. A missing key fails the task rather than shipping an unresolved ${...}.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id        : mod_id,
            mod_name      : mod_name,
            mod_license   : mod_license,
            mod_author    : mod_author,
            mod_version   : mod_version,
            minecraft_version: mcVersion,
            mixin_java_level : "JAVA_${javaLevel}",
            java_level        : javaLevel,
            fabric_loader_version: loaderVersion,
            fabric_api_version   : fabricApiVersion,
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand replaceProperties
    }
}
