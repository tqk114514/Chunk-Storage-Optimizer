// The loader-independent half of the Voxy compatibility: the in-memory Anvil synthesis and the
// importer hooks. Neither touches a Minecraft or loader class â the mixin targets Voxy's own
// WorldImporter and the synthesis is pure JDK plus core â so the same sources compile into
// every loader jar that carries them (the fabric half beside it does today; a neoforge half
// would too, which is the position this layout keeps open, Voxy itself shipping for Fabric
// only so far). This module's own jar ships nowhere; it exists because the compat's tests
// need a Gradle home that every row can reach â the role :core plays for the main mod.
//
// The bug this compat fixes: Voxy's world import lists a save's region folder and parses what
// it recognises as Anvil regions â a .cso file is not one, so importing a Chunk Storage
// Optimizer world skipped all of its terrain. The hooks widen that listing and materialise
// each .cso as an in-memory Anvil region (see CsoAnvilRegionSynth), so the parsing, the job
// queue and the voxelization all stay Voxy's own.
plugins {
    id 'java-library'
}

// The same group as this compat's jar modules — see the fabric half for why the compat
// layer cannot share the main mod's group.
group = "${mod_group_id}.compat.voxy"

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The synthesis reaches core's public API (CsoRegionFile), and core is deliberately compiled
// from source everywhere rather than depended on as a library: no jar ever ships a second
// copy of it. The jar filter in the loader halves keeps this module's output clean of the
// same sources.
sourceSets.main.java.srcDir rootProject.file('core/src/main/java')

dependencies {
    // Voxy, pinned by Modrinth version id (see the fabric half for why the id rather than the
    // version number: it names the exact jar, 0.2.16-beta built for 1.21.11). A plain
    // compileOnly suffices here: the mixin names only Voxy's own classes, which intermediary
    // never touches â the remap loom performs for the fabric half changes nothing about them.
    compileOnly 'maven.modrinth:voxy:H3w2nVdU'
    // The mixin annotations and the logging the hooks use; provided by the game at runtime.
    compileOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'
    // Core's codec imports zstd; the runtime copy always comes from the main mod's nested jar.
    compileOnly 'com.github.luben:zstd-jni:1.5.6-3'

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The synthesis test round-trips compressed regions, which needs the codec present.
    testRuntimeOnly 'com.github.luben:zstd-jni:1.5.6-3'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// ------------------------------------------------------------------ the target-mod version matrix
//
// The tests do not stop at this compat's pinned release: every release of Voxy that exists
// for a Minecraft in supported-versions.csv is fetched and its bytecode checked against every
// member the mixins need (see the testkit and VoxyVersionMatrixTest). The fetch is
// incremental — an already-downloaded version id is never downloaded again — and it
// re-queries the list on every run, so a fresh Voxy release fails the build the day it
// appears. Offline escape hatch: -PcsoTargetModsOffline runs against whatever the cache
// already holds and refuses only when it holds nothing.
//
// The Minecraft rows the matrix covers, in Modrinth's own spelling of them; parsed at
// configuration time because the configuration cache forbids rootProject use inside doLast.
def gameTags = []
rootProject.file('supported-versions.csv').eachLine { line ->
    def trimmed = line.trim()
    if (!trimmed.isEmpty() && !trimmed.startsWith('#')) {
        def key = trimmed.split(',')[0].trim()
        gameTags << (key.startsWith('26.') && key.endsWith('.0') ? key.substring(0, key.length() - 2) : key)
    }
}
def targetModsOffline = project.hasProperty('csoTargetModsOffline')
def targetModsDir = layout.buildDirectory.dir('target-mods/voxy')
def downloadTargetMods = tasks.register('downloadTargetMods') {
    description = 'Fetches every Modrinth release of Voxy for the csv Minecrafts.'
    outputs.dir(targetModsDir)
    doLast {
        def dir = targetModsDir.get().asFile
        dir.mkdirs()
        // The API wants JSON arrays; building them by hand keeps the task dependency-free.
        def query = '?game_versions=' + java.net.URLEncoder.encode(
            new groovy.json.JsonBuilder(gameTags).toString(), 'UTF-8') +
            '&loaders=' + java.net.URLEncoder.encode('["fabric"]', 'UTF-8')
        def versions = new groovy.json.JsonSlurper().parse(new URL('https://api.modrinth.com/v2/project/voxy/version' + query))
        def lines = []
        versions.each { version ->
            def primary = version.files.find { it.primary } ?: version.files[0]
            def target = new File(dir, primary.filename)
            if (!target.exists() || target.length() != (long) primary.size) {
                if (targetModsOffline) {
                    return
                }
                new URL(primary.url).withInputStream { input ->
                    target.withOutputStream { output -> output << input }
                }
            }
            lines << [version.id, version.version_number, version.loaders.join('+'),
                      version.game_versions.join('+'), primary.filename].join('\t')
        }
        new File(dir, 'manifest.tsv').text = String.join('\n', lines)
        logger.lifecycle("target-mod matrix: {} Voxy release jars in {}", lines.size(), dir)
    }
}
sourceSets.test.java.srcDir rootProject.file('compat/testkit/src/main/java')
dependencies {
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
}
tasks.named('test', Test).configure {
    dependsOn downloadTargetMods
    systemProperty 'cso.targetMods.voxy', targetModsDir.get().asFile.absolutePath
}
