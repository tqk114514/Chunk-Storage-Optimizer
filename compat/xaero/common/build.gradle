// The loader-independent half of the Xaero World Map compatibility: the mixin itself plus its
// regression tests. The mixin targets only Xaero's own classes â no Minecraft, no loader â so
// the same source compiles into both loader halves beside it (fabric/, neoforge/), which add
// this directory as a source root the same way the main mod compiles core/ and common/ into
// each of its loader modules. This module's own jar ships nowhere; it exists because the
// compat's tests need a Gradle home that every row can reach â the role :core plays for the
// main mod.
//
// The bug the mixin fixes: in singleplayer Xaero's world map runs in "world save" mode, where
// it detects the save's regions by listing the region folder for `r.X.Z.mca`. A Chunk Storage
// Optimizer world holds its regions as `r.X.Z.cso`, so the scan finds nothing â every session
// starts with an empty region set and everything recorded before comes back as unexplored fog.
// The fix widens that one scan (and the backing-file fallback) to `.cso`; the tile rebuild
// itself already works, because it reads chunks through the ordinary storage path the main mod
// serves.
plugins {
    id 'java-library'
}

// The same group as this compat's jar modules — see the fabric half for why the compat
// layer cannot share the main mod's group.
group = "${mod_group_id}.compat.xaero"

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

// Toolchain 25, because the pinned Xaero jar is compiled for it (class file 69) and a Java 21
// compiler cannot even read it. The OUTPUT stays at release 21: both loader jars below run on
// every Minecraft row the main mod ships for.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    // Xaero's World Map, pinned to the release this mixin was written against. The coordinate
    // uses the Modrinth version id rather than the version number: the same number is reused
    // across loaders, and the id names the exact jar (fabric 26.3, 1.47.0). Each loader half
    // pins the same release for its own loader, so a shape change Xaero ships for one loader
    // is caught by whichever module compiles against it.
    compileOnly 'maven.modrinth:xaeros-world-map:nz9xjzWi'
    // The mixin annotations â the same artifact fabric-loader runs against â and the logging
    // the status report uses. Both are provided by the game at runtime.
    compileOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    compileOnly 'org.slf4j:slf4j-api:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// ------------------------------------------------------------------ the target-mod version matrix
//
// The tests do not stop at this compat's pinned release: every release of Xaero's World Map
// that exists for a Minecraft in supported-versions.csv, on both loaders it builds for, is
// fetched and its bytecode checked against every member the mixins need (see the testkit and
// XaeroWorldMapVersionMatrixTest). The fetch is incremental — an already-downloaded version
// id is never downloaded again — and it re-queries the list on every run, so a fresh Xaero
// release fails the build the day it appears. Offline escape hatch: -PcsoTargetModsOffline
// runs against whatever the cache already holds and refuses only when it holds nothing.
// The Minecraft rows the matrix covers, in Modrinth's own spelling of them; parsed at
// configuration time because the configuration cache forbids rootProject use inside doLast.
def gameTags = []
rootProject.file('supported-versions.csv').eachLine { line ->
    def trimmed = line.trim()
    if (!trimmed.isEmpty() && !trimmed.startsWith('#')) {
        def key = trimmed.split(',')[0].trim()
        gameTags << (key.startsWith('26.') && key.endsWith('.0') ? key.substring(0, key.length() - 2) : key)
    }
}
def targetModsOffline = project.hasProperty('csoTargetModsOffline')
def targetModsDir = layout.buildDirectory.dir('target-mods/xaero-world-map')
def downloadTargetMods = tasks.register('downloadTargetMods') {
    description = 'Fetches every Modrinth release of Xaero World Map for the csv Minecrafts.'
    outputs.dir(targetModsDir)
    doLast {
        def dir = targetModsDir.get().asFile
        dir.mkdirs()
        // The API wants JSON arrays; building them by hand keeps the task dependency-free.
        def query = '?game_versions=' + java.net.URLEncoder.encode(
            new groovy.json.JsonBuilder(gameTags).toString(), 'UTF-8') +
            '&loaders=' + java.net.URLEncoder.encode('["fabric","neoforge"]', 'UTF-8')
        def versions = new groovy.json.JsonSlurper().parse(new URL('https://api.modrinth.com/v2/project/xaeros-world-map/version' + query))
        def lines = []
        versions.each { version ->
            def primary = version.files.find { it.primary } ?: version.files[0]
            def target = new File(dir, primary.filename)
            if (!target.exists() || target.length() != (long) primary.size) {
                if (targetModsOffline) {
                    return
                }
                new URL(primary.url).withInputStream { input ->
                    target.withOutputStream { output -> output << input }
                }
            }
            lines << [version.id, version.version_number, version.loaders.join('+'),
                      version.game_versions.join('+'), primary.filename].join('\t')
        }
        new File(dir, 'manifest.tsv').text = String.join('\n', lines)
        logger.lifecycle("target-mod matrix: {} Xaero World Map release jars in {}", lines.size(), dir)
    }
}
sourceSets.test.java.srcDir rootProject.file('compat/testkit/src/main/java')
dependencies {
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
}
tasks.named('test', Test).configure {
    dependsOn downloadTargetMods
    systemProperty 'cso.targetMods.xaero', targetModsDir.get().asFile.absolutePath
}
