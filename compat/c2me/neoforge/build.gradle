// The NeoForge half of the C2ME compatibility: a small neoforge mod that ships as a NESTED
// mod inside the main neoforge jar (neoforge/build.gradle jarJars it — NeoForge's own answer
// to loom's `include`), so players download exactly one file. Never published or installed on
// its own. The mixins themselves are loader-independent and come from the half beside it
// (compat/c2me/common), added below as a source root together with the main mod's core and
// common halves — the same layering the other compat lines use.
//
// Like the Fabric half this module pins the 26.x family (the mixins name Minecraft's own 26.x
// classes), fixed at 26.3 — the row the bridge was verified on — and its metadata pins no
// Minecraft version: the jar is the same for every row it rides in, and the plugin stands the
// mixins down wherever the probed classes do not resolve, which keeps the main mod's guard
// in charge of those rows. What IS written per row are the neoforge range and the FML icon
// seam, resolved exactly like the main neoforge module resolves its own — the jar travels
// nested inside that module's jar for one Minecraft and can never meet another loader line.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

// The compat's version number is its own, deliberately not the main mod's: it moves only when
// the compat itself changes, so a main-mod release never has to bump it.
def compatVersion = '1.0.0'
// Underscore, because NeoForge restricts mod ids to [a-z0-9_] and both halves share one id.
def compatId = 'chunkstorageoptimizer_c2mecompat'

version = compatVersion
// A group of this compat's own — see the fabric half for why the compat lines cannot share
// the main mod's group coordinates.
group = "${mod_group_id}.compat.c2me"

repositories {
    mavenCentral()
}

// ------------------------------------------------------------------ what we build for

// The same row resolution the neoforge module runs (see neoforge/build.gradle): this jar ships
// nested inside the neoforge jar of whichever Minecraft that module builds for, so its
// metadata declares that row's loader requirements. Default row 26.3 — the pin, see the
// header. Only the columns the metadata needs are read here.
def supportedVersions = [:]
def rowFmlMajors = [:]
def versionTable = rootProject.file('supported-versions.csv')
versionTable.eachLine { line ->
    def trimmed = line.trim()
    if (trimmed.isEmpty() || trimmed.startsWith('#')) {
        return
    }
    def columns = trimmed.split(',').collect { it.trim() }
    supportedVersions[columns[0]] = columns[3]
    rowFmlMajors[columns[0]] = columns[6]
}
if (supportedVersions.isEmpty()) {
    throw new GradleException("${versionTable} has no data rows.")
}
def mcVersion = (project.findProperty('minecraft_version') ?: '26.3.0') as String
def rowNeoFloor = supportedVersions[mcVersion]
if (rowNeoFloor == null) {
    throw new GradleException("Minecraft ${mcVersion} is not listed in supported-versions.csv " \
        + "(known: ${supportedVersions.keySet().join(', ')}). Add a row before building for it.")
}
if (rowNeoFloor == '-') {
    throw new GradleException("Minecraft ${mcVersion} has no NeoForge build in supported-versions.csv.")
}
def neoVersion = (project.findProperty('neo_version') ?: rowNeoFloor) as String
// The icon field name is the FML seam, same as the main module: FML 12 renamed logoFile to
// iconFile, and the old name still works but warns.
def fmlMajor = (project.findProperty('fml_major') ?: rowFmlMajors[mcVersion]) as String

// The loader drops the old "1." prefix, so Minecraft 1.21.11 is served by the 21.11 line; a
// two-part version means patch 0. Guards against a row whose floor was copied in from a
// different Minecraft, which would otherwise only surface as a jar no player can load.
def loaderLine = mcVersion.startsWith('1.') ? mcVersion.substring(2) : mcVersion
if (!loaderLine.contains('.')) {
    loaderLine += '.0'
}
if (!neoVersion.startsWith("${loaderLine}.")) {
    throw new GradleException("NeoForge floor ${neoVersion} does not belong to Minecraft ${mcVersion} " \
        + "(expected a build of ${loaderLine}.N).")
}
// Stop the dependency range at the next loader line instead of running to infinity: that line
// is a different Minecraft, and an untested newer loader should refuse us, not crash.
def upperParts = loaderLine.split('\\.').collect { it as int }
upperParts[-1] = upperParts[-1] + 1
def neoUpper = upperParts.join('.')

base.archivesName = "${compatId}-neoforge"

// Toolchain 25, because the pinned 26.3 game classes are compiled for it (class file 69). The
// OUTPUT stays at release 21: the jar rides every row the main mod ships for, and only its
// plugin decides where the mixins come alive.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// Reading Java 25 bytecode while emitting Java 21 needs one word to the variant matching:
// Gradle derives the consumer's TargetJvmVersion from options.release, then refuses the 26.x
// artifact for a "Java 21" consumer (measured) — even though a 25 toolchain reads class file
// 69 on the classpath under --release 21 just fine, which is exactly how the Xaero compat
// compiles against its class-69 pin. The attribute goes on the RESOLVABLE configurations
// only, though: the outgoing elements must keep advertising the release they emit (21), or
// the 1.21 rows' main module — a Java 21 consumer — would refuse this project the same way
// (measured on the 1.21.11 row build), and the compat rides in those rows' jars too, stood
// down by its plugin.
import org.gradle.api.attributes.java.TargetJvmVersion
configurations.configureEach {
    if (it.isCanBeResolved()) {
        it.attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
    }
}

// Core (the codec the storage layer names), the main mod's common half (CsoRuntime and the
// storage classes live there) with the two version seams its row selects, and this compat's
// own sources — the same set of roots the fabric half compiles.
sourceSets.main.java.srcDir rootProject.file('core/src/main/java')
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.java.srcDir rootProject.file('common/src/version/modern/java')
sourceSets.main.java.srcDir rootProject.file('common/src/version/uuid/java')
sourceSets.main.java.srcDir rootProject.file('compat/c2me/common/src/main/java')
// The compat's tests: the vanilla-shape contract runs against the pinned game on this
// module's test classpath, and the C2ME version matrix reads downloaded jars.
sourceSets.test.java.srcDir rootProject.file('compat/c2me/common/src/test/java')

neoForge {
    // The fixed compile pin (see the header). No runs of its own: the compat is exercised
    // through :neoforge:runServer, which loads it from its classpath via the jarJar wiring.
    version = '26.3.0.76'
}

dependencies {
    // Core's codec imports zstd; runtime always comes from the main mod's nested jar.
    implementation 'com.github.luben:zstd-jni:1.5.6-3'

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The C2ME version matrix test reads release jars as bytecode, the level Mixin works at.
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
}

// ModDevGradle puts the game on the main source set's classpath only. These tests need no
// NeoForge runtime — no mixin application, no mod loading — just the game's classes, so the
// main classpath is unioned onto the test classpath and stays there as jars (the same
// workaround the main neoforge module measured its way to).
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Expand the mod metadata like the main neoforge module does; a missing property fails the
// task rather than shipping an unresolved ${...}.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            compat_id             : compatId,
            compat_version        : compatVersion,
            minecraft_version_range: "[${mcVersion}]",
            neo_version            : neoVersion,
            neo_version_upper      : neoUpper,
            mod_icon_field         : fmlMajor == '12' ? 'iconFile' : 'logoFile',
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// The lang files, staged from the Fabric half beside their Mod Menu siblings — the single
// source both halves share and Crowdin fills. The Mods screen translates a mod's description
// through the language map (fml.menu.mods.info.description.<id> / neoforge.screen.mods.info.
// description.<id> on FML 12), with the neoforge.mods.toml text as the English fallback, so
// the nested compat needs the lang files after all. The staging works like the metadata one
// above: the task's destination becomes a resources source dir, so the tree inside it must
// already carry the jar-relative path — the child `into` puts the files under
// assets/<id>/lang/, because staging them straight into the destination root would land
// every json at the jar's root (measured). Only the lang folder comes over: the Fabric half's
// resources also hold fabric.mod.json, which must not leak into a NeoForge jar.
def stageCompatLang = tasks.register('stageCompatLang', Sync) {
    into 'build/generated/sources/compatLang'
    from(rootProject.file('compat/c2me/fabric/src/main/resources/assets/chunkstorageoptimizer_c2mecompat/lang')) {
        into 'assets/chunkstorageoptimizer_c2mecompat/lang'
    }
}
sourceSets.main.resources.srcDir stageCompatLang

// Only this module's own classes and resources ship (see the header note). Everything else on
// the compile classpath is provided by the game and the main mod at runtime.
tasks.named('jar', Jar).configure {
    include 'tqk114514/chunkstorageoptimizer/compat/**'
    include 'META-INF/neoforge.mods.toml'
    include "${compatId}.mixins.json"
    include 'assets/**'
}

// ------------------------------------------------------------------ the target-mod version matrix
//
// The same fetch the fabric half runs — every C2ME release for the 26.x Minecrafts, both
// loaders, rewrite module extracted beside the outer jar — so this module's test run holds
// the same line independently. See the fabric half for the mechanics and the offline hatch.
def targetModsOffline = project.hasProperty('csoTargetModsOffline')
def targetModsDir = layout.buildDirectory.dir('target-mods/c2me')
def downloadTargetMods = tasks.register('downloadTargetMods') {
    description = 'Fetches every C2ME release for the 26.x Minecrafts, both loaders, and extracts each rewrite module.'
    outputs.dir(targetModsDir)
    doLast {
        def dir = targetModsDir.get().asFile
        dir.mkdirs()
        def lines = []
        ['c2me-fabric'   : 'fabric',
         'c2me-neoforge' : 'neoforge'].each { projectSlug, loader ->
            def query = '?game_versions=' + java.net.URLEncoder.encode('["26.1","26.2","26.3"]', 'UTF-8') +
                '&loaders=' + java.net.URLEncoder.encode("[\"${loader}\"]", 'UTF-8')
            def versions = new groovy.json.JsonSlurper().parse(
                new URL("https://api.modrinth.com/v2/project/${projectSlug}/version" + query))
            versions.each { version ->
                def primary = version.files.find { it.primary } ?: version.files[0]
                def outer = new File(dir, primary.filename)
                if (!outer.exists() || outer.length() != (long) primary.size) {
                    if (targetModsOffline) {
                        return
                    }
                    new URL(primary.url).withInputStream { input ->
                        outer.withOutputStream { output -> output << input }
                    }
                }
                def moduleName = primary.filename.replaceFirst(/\.(jar|zip)$/, '') + '.rewrites-chunkio.jar'
                def module = new File(dir, "${projectSlug}__${moduleName}")
                if (!module.exists()) {
                    def jar = new java.util.jar.JarFile(outer)
                    def entry = jar.entries().findAll { e ->
                        e.name.endsWith('.jar') && e.name.contains('rewrites-chunkio')
                    }
                    if (entry.isEmpty()) {
                        throw new GradleException("C2ME ${primary.filename} has no rewrites-chunkio module jar")
                    }
                    jar.getInputStream(entry[0]).withStream { input ->
                        module.withOutputStream { output -> output << input }
                    }
                    jar.close()
                }
                lines << [version.id, version.version_number, loader, version.game_versions.join('+'),
                          primary.filename].join('\t')
            }
        }
        new File(dir, 'manifest.tsv').text = String.join('\n', lines)
        logger.lifecycle("target-mod matrix: {} C2ME release jars in {}", lines.size(), dir)
    }
}
tasks.named('test', Test).configure {
    dependsOn downloadTargetMods
    systemProperty 'cso.targetMods.c2me', targetModsDir.get().asFile.absolutePath
}
