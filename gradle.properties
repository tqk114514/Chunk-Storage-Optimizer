# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# minecraft_version is the only version knob. It decides which loader modules settings.gradle
# includes, and each module's NeoForge floor / Fabric API pin, the ranges written into the mod
# metadata, the Java level and the command-permission seam all come from that row of
# supported-versions.csv. Build for another Minecraft with:
#   ./gradlew :neoforge:build -Pminecraft_version=26.2.0
#   ./gradlew :fabric:build -Pminecraft_version=1.21.9
# Left unset, each loader module falls back to its own default row, so nothing here pins a
# Minecraft: a shared default would pick one loader's version and make the other module vanish.
# Override -Pneo_version only to deviate from the pinned floor (see tools/oldest-stable-neoforge.sh
# for how the floor itself is chosen).

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=chunkstorageoptimizer
# The human-readable display name for the mod.
mod_name=Chunk Storage Optimizer
# The license of the mod. Must match LICENSE at the repository root — this string is what the
# in-game Mods screen and neoforge.mods.toml show.
mod_license=MIT
# The author shown in the in-game Mods screen.
mod_author=tqk114514
# The mod version. See https://semver.org/
mod_version=1.0.3
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=tqk114514.chunkstorageoptimizer
